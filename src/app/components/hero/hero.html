<!-- src/app/components/hero/hero.html -->

<!-- La classe de fond est maintenant dynamique grâce à [ngClass] -->
<section class="hero-section text-white py-5" [ngClass]="heroContent.backgroundClass">
  <div class="container text-center py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        
        <!-- Le titre est injecté dynamiquement avec [innerHTML] pour interpréter le <span> -->
        <h1 class="display-4 fw-bold mb-4" [innerHTML]="heroContent.title"></h1>
        
        <!-- Le sous-titre est aussi dynamique -->
        <p class="lead fs-4 mb-5">{{ heroContent.subtitle }}</p>
        
        <!-- Le bouton d'appel à l'action -->
        <button (click)="scrollToStatus()" class="btn btn-light btn-lg px-5 py-3 fw-medium hero-button">
          <i class="fas fa-chart-line me-2"></i>
          Voir l'état actuel
        </button>
      </div>
    </div>
  </div>
</section>

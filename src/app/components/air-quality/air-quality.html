<section id="airQuality" class="py-5 bg-white">
  <div class="container">
    <!-- Titre de la section -->
    <div class="text-center mb-4">
      <h2 class="fw-bold text-dark mb-2">
        <i class="fas fa-chart-area text-success me-3"></i>
        Prévisions Qualité de l'Air
      </h2>

      <!-- Affichage du capteur actuel -->
      <p *ngIf="currentSensor" class="text-muted">
        <i class="fas fa-map-marker-alt me-2"></i>
        {{ currentSensor.name }} - {{ currentSensor.city }}
      </p>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-lg border-0">
          <div class="card-body p-4 p-lg-5">

            <!-- En-tête avec titre, sélecteur de période et indicateur de chargement -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
              <h3 class="h5 card-title mb-0">Indice de Qualité de l'Air (IQA)</h3>

              <!-- ✅ SÉLECTEUR DE PÉRIODE -->
              <div class="d-flex align-items-center gap-2">
                <label for="periodSelect" class="form-label mb-0 me-2 text-muted small">
                  <i class="fas fa-clock me-1"></i>
                  Période :
                </label>
                <select
                  id="periodSelect"
                  class="form-select form-select-sm period-selector"
                  [(ngModel)]="selectedPeriod"
                  (change)="onPeriodChange()"
                  [disabled]="isLoading">
                  <option *ngFor="let period of periods" [value]="period.value">
                    {{ period.label }}
                  </option>
                </select>

                <!-- Indicateur de chargement -->
                <div *ngIf="isLoading" class="spinner-border spinner-border-sm text-primary ms-2" role="status">
                  <span class="visually-hidden">Chargement...</span>
                </div>
              </div>
            </div>

            <!-- Message d'erreur -->
            <div *ngIf="errorMessage && !isLoading" class="alert alert-warning" role="alert">
              <i class="fas fa-exclamation-triangle me-2"></i>
              {{ errorMessage }}
            </div>

            <!-- Conteneur pour le graphique -->
            <div *ngIf="!errorMessage" class="chart-container">
              <canvas #airQualityChart>Votre navigateur ne supporte pas les canvas.</canvas>
            </div>

            <!-- ✅ LÉGENDE AVEC 6 NIVEAUX -->
            <div class="row g-2 mt-4 text-center text-md-start">
              <div class="col-6 col-md-4 col-lg-2">
                <span class="legend-dot bg-aqi-good"></span>
                <small>Bon<br><span class="text-muted">(0-50)</span></small>
              </div>
              <div class="col-6 col-md-4 col-lg-2">
                <span class="legend-dot bg-aqi-moderate"></span>
                <small>Modéré<br><span class="text-muted">(51-100)</span></small>
              </div>
              <div class="col-6 col-md-4 col-lg-2">
                <span class="legend-dot bg-aqi-sensitive"></span>
                <small>Sensible<br><span class="text-muted">(101-150)</span></small>
              </div>
              <div class="col-6 col-md-4 col-lg-2">
                <span class="legend-dot bg-aqi-unhealthy"></span>
                <small>Mauvais<br><span class="text-muted">(151-200)</span></small>
              </div>
              <div class="col-6 col-md-4 col-lg-2">
                <span class="legend-dot bg-aqi-very-unhealthy"></span>
                <small>Très mauvais<br><span class="text-muted">(201-300)</span></small>
              </div>
              <div class="col-6 col-md-4 col-lg-2">
                <span class="legend-dot bg-aqi-hazardous"></span>
                <small>Dangereux<br><span class="text-muted">(301+)</span></small>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

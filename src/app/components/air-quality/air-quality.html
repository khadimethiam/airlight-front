<section id="airQuality" class="py-5 bg-white">
  <div class="container">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-dark mb-2">
        <i class="fas fa-chart-area text-success me-3"></i>
        Prévisions Qualité de l'Air
      </h2>
      <p *ngIf="currentSensor" class="text-muted">
        <i class="fas fa-map-marker-alt me-2"></i>
        {{ currentSensor.name }} - {{ currentSensor.city }}
      </p>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        <div class="card shadow-lg border-0">
          <div class="card-body p-3 p-md-4 p-lg-5">

            <!-- En-tête titre + sélecteur -->
            <div class="header-row mb-4">
              <h3 class="h5 card-title mb-0">Indice de Qualité de l'Air (IQA)</h3>

              <div class="selector-row">
                <label for="periodSelect" class="form-label mb-0 text-muted small">
                  <i class="fas fa-clock me-1"></i>
                  Période :
                </label>
                <select
                  id="periodSelect"
                  class="form-select form-select-sm period-selector"
                  [(ngModel)]="selectedPeriod"
                  (change)="onPeriodChange()"
                  [disabled]="isLoading">
                  <option *ngFor="let period of periods" [value]="period.value">
                    {{ period.label }}
                  </option>
                </select>

                <div *ngIf="isLoading" class="spinner-border spinner-border-sm text-primary" role="status">
                  <span class="visually-hidden">Chargement...</span>
                </div>
              </div>
            </div>

            <!-- Message d'erreur -->
            <div *ngIf="errorMessage && !isLoading" class="alert alert-warning" role="alert">
              <i class="fas fa-exclamation-triangle me-2"></i>
              {{ errorMessage }}
            </div>

            <!-- Graphique -->
            <div *ngIf="!errorMessage" class="chart-container">
              <canvas #airQualityChart>Votre navigateur ne supporte pas les canvas.</canvas>
            </div>

            <!-- Légende responsive -->
            <div class="legend-grid mt-4">
              <div class="legend-item">
                <span class="legend-dot bg-aqi-good"></span>
                <div class="legend-text">
                  <span class="legend-label">Bon</span>
                  <span class="legend-range">(0-50)</span>
                </div>
              </div>
              <div class="legend-item">
                <span class="legend-dot bg-aqi-moderate"></span>
                <div class="legend-text">
                  <span class="legend-label">Modéré</span>
                  <span class="legend-range">(51-100)</span>
                </div>
              </div>
              <div class="legend-item">
                <span class="legend-dot bg-aqi-sensitive"></span>
                <div class="legend-text">
                  <span class="legend-label">Sensible</span>
                  <span class="legend-range">(101-150)</span>
                </div>
              </div>
              <div class="legend-item">
                <span class="legend-dot bg-aqi-unhealthy"></span>
                <div class="legend-text">
                  <span class="legend-label">Mauvais</span>
                  <span class="legend-range">(151-200)</span>
                </div>
              </div>
              <div class="legend-item">
                <span class="legend-dot bg-aqi-very-unhealthy"></span>
                <div class="legend-text">
                  <span class="legend-label">Très mauvais</span>
                  <span class="legend-range">(201-300)</span>
                </div>
              </div>
              <div class="legend-item">
                <span class="legend-dot bg-aqi-hazardous"></span>
                <div class="legend-text">
                  <span class="legend-label">Dangereux</span>
                  <span class="legend-range">(301+)</span>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

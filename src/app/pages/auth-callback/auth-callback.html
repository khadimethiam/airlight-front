<div class="min-vh-100 d-flex align-items-center justify-content-center" 
     style="background: linear-gradient(135deg, #87CEEB 0%, #90EE90 100%);">
  <div class="text-center">
    <!-- Spinner animé -->
    <div class="spinner-border text-white mb-3" 
         style="width: 3rem; height: 3rem;" 
         role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
    
    <!-- Message principal -->
    <h3 class="text-white fw-bold mb-2">{{ message }}</h3>
    
    <!-- Sous-message -->
    <p class="text-white-50">{{ subMessage }}</p>
    
    <!-- Icône de succès (optionnelle, affichée quand l'auth réussit) -->
    <div *ngIf="message.includes('Bienvenue')" class="mt-3">
      <i class="fas fa-check-circle text-white" style="font-size: 2rem;"></i>
    </div>
    
    <!-- Icône d'erreur (optionnelle, affichée en cas d'erreur) -->
    <div *ngIf="message.includes('Erreur')" class="mt-3">
      <i class="fas fa-exclamation-circle text-danger" style="font-size: 2rem;"></i>
    </div>
  </div>
</div>
